name: Meridian Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scanning:
    name: TruffleHog Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine scan mode
        id: scan-mode
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "full_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog Secrets Scan (full repo)
        if: steps.scan-mode.outputs.full_scan == 'true' || github.event_name == 'push' && github.event.before == null
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug

      - name: Run TruffleHog Secrets Scan (diff)
        if: steps.scan-mode.outputs.full_scan == 'false'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug


  sast-scanning:
    name: Bandit SAST Scan
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

            - name: Run Bandit SAST (blocking - HIGH severity)
        run: python -m bandit -r app/ -lll -ii -f txt

      - name: Run Bandit SAST (informational - MEDIUM severity)
        run: python -m bandit -r app/ -ll -ii -f txt || true


  dependency-scanning:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    needs: sast-scanning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r app/requirements.txt
